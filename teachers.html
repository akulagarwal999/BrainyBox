<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Teachers - BrainyBox</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation (Simplified) -->
    <nav id="navbar" class="scrolled">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo.jpg" alt="BrainyBox Logo">
                <span>BrainyBox</span>
            </a>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> Home</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="grid-layout-page">
        <div class="container">
            <div class="page-header">
                <a href="index.html#teachers" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
                <h1>Our Expert Teachers</h1>
            </div>
            
            <div id="full-teachers-grid" class="full-grid">
                <!-- Data injected via JS -->
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="container">
        <div class="footer-bottom" style="border-top: none; padding-top: 2rem;">
          <p>&copy; 2024 Brainybox Coaching Institute. All Rights Reserved. | <a href="privacy-policy.html" style="color:var(--primary-light); text-decoration:none; font-weight:600;">Privacy Policy</a></p>
        </div>
      </div>
    </footer>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <!-- Data Manager -->
    <script src="dataManager.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if(typeof DataManager === 'undefined') return;
            const data = DataManager.getData();
            if(!data) return;

            const grid = document.getElementById('full-teachers-grid');
            if(grid) {
                grid.innerHTML = data.teachers.map(t => `
                    <div class="teacher-card glass-card" style="height: 100%; display: flex; flex-direction: column;">
                        <div class="img-container">
                            <img src="${t.image}" alt="${t.name}">
                            <div class="subject-badge">${t.experience} Exp</div>
                        </div>
                        <div class="teacher-info" style="flex: 1;">
                            <h3>${t.name}</h3>
                            <p class="role">${t.subject}</p>
                            <p class="desc">${t.description}</p>
                        </div>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>
